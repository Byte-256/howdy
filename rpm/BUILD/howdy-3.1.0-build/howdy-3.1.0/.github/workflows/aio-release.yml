name: Build & publish AIO release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach assets to (must already exist for updates)'
        required: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  aio:
    name: AIO tarball (${{ matrix.arch }})
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        # Native x86_64 build; aarch64 via cross toolchain below
        include:
          - arch: x86_64
            platform: amd64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: sudo bash scripts/build-aio.sh --install-deps

      - name: Build AIO tarball
        run: bash scripts/build-aio.sh

      - name: Smoke test the bundle
        run: |
          SO=dist/aio-build/stage/usr/lib/security/pam_howdy.so
          PY=dist/aio-build/stage/opt/howdy/python/bin/python3
          # rpath resolution check (bundled libs, static libstdc++)
          ldd -r "$SO"
          # bundled interpreter + vendored deps import check
          "$PY" -c "import sys; sys.path.insert(0, 'dist/aio-build/stage/opt/howdy/pysrc/howdy'); import cv2, numpy; print('cv2', cv2.__version__, '| numpy', numpy.__version__)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: howdy-aio-${{ matrix.arch }}
          path: |
            dist/howdy-aio-*.tar.gz
            dist/howdy-aio-*.sha256
          if-no-files-found: error

      - name: Publish to release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            dist/howdy-aio-*.tar.gz
            dist/howdy-aio-*.sha256
          fail_on_unmatched_files: true
          make_latest: true
